<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>La aventura del laberinto · Aprende Scratch</title>
<style>
:root{--ink:#20304a;--blue:#2878e8;--yellow:#ffd84d;--green:#27b66b;--pink:#ff6b8a;--paper:#fffdf6;--muted:#64748b}
*{box-sizing:border-box}
body{margin:0;background:#f1f6ff;color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
header{background:linear-gradient(110deg,#2369d8,#704bd8);color:white;padding:20px clamp(16px,4vw,48px);display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}.logo{font-size:38px;background:#ffffff25;border-radius:16px;padding:7px 12px}
h1{font-size:clamp(22px,3vw,32px);margin:0}header p{margin:3px 0 0;opacity:.9}
.top-actions{display:flex;gap:8px;flex-wrap:wrap}
button,.button{border:0;border-radius:13px;padding:11px 16px;font:700 15px inherit;cursor:pointer;transition:.15s}
button:hover,.button:hover{transform:translateY(-1px);filter:brightness(.98)}
button:focus-visible,a:focus-visible{outline:3px solid #ffb000;outline-offset:3px}
.white{background:white;color:#29436c}.dark{background:#263b60;color:white}
main{max-width:1120px;margin:22px auto;padding:0 16px 44px;display:grid;grid-template-columns:265px minmax(0,1fr);gap:20px}
aside,.panel{background:white;border-radius:22px;box-shadow:0 8px 24px #29436c12}
aside{padding:18px;height:max-content;position:sticky;top:14px}
.progress-title{font-weight:800;display:flex;justify-content:space-between}.track{height:12px;background:#e8eef8;border-radius:99px;margin:10px 0 17px;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,#20bd80,#9bdc45);width:0%;transition:width .3s}
nav{display:grid;gap:7px}.nav-step{display:flex;gap:10px;align-items:center;text-align:left;background:#f4f7fc;color:#33445e;width:100%;padding:10px;border:2px solid transparent}
.nav-step.active{background:#eaf2ff;border-color:#8db8ff;color:#174ea6}.nav-step.done .num{background:#22ae70;color:white}
.num{width:30px;height:30px;border-radius:10px;background:#e0e8f5;display:grid;place-items:center;font-weight:900;flex:none}
.nav-label{font-weight:750}.nav-time{font-size:12px;color:var(--muted);margin-left:auto}
main>section{min-width:0}.panel{padding:clamp(18px,3vw,32px);min-height:620px}
.eyebrow{color:#5d69b7;text-transform:uppercase;letter-spacing:.09em;font-size:12px;font-weight:900}
h2{font-size:clamp(25px,3vw,34px);margin:7px 0 8px}.lead{font-size:17px;line-height:1.55;color:#52627a;margin:0 0 20px}
.callout{background:#fff7d9;border-left:5px solid #f4c32e;padding:13px 16px;border-radius:12px;margin:17px 0;line-height:1.5}
.task{border:2px solid #e7edf7;border-radius:17px;padding:16px;margin:14px 0;background:#fff}
.task h3{margin:0 0 8px;font-size:18px}.task p{margin:6px 0;color:#53627a;line-height:1.5}
.checkrow{display:flex;gap:10px;align-items:flex-start;margin-top:12px;font-weight:700}.checkrow input{width:20px;height:20px;accent-color:#20a96c;margin-top:2px}
.block-stack{display:flex;flex-direction:column;align-items:flex-start;gap:3px;margin:15px 0;padding:15px;background:#f4f7fb;border-radius:15px;overflow-x:auto}
.sblock{position:relative;color:#fff;font-weight:800;font-size:14px;min-height:36px;padding:9px 13px 9px 18px;min-width:230px;max-width:100%;box-shadow:inset 0 -3px #0002;clip-path:polygon(0 0,12px 0,18px 5px,26px 0,100% 0,100% 100%,0 100%)}
.hat{border-radius:15px 15px 5px 5px;padding-top:12px}.c{background:#ffab19}.e{background:#ffbf36}.m{background:#4c97ff}.s{background:#9966ff}.v{background:#ff8c1a}.control{background:#ffab19}
.pill{display:inline-block;background:#fff;color:#35435c;border-radius:20px;padding:3px 9px;margin:0 2px;font-weight:800}
.arrow{color:#8b9ab0;font-size:20px;font-weight:900;padding-left:24px;line-height:1}
.tip{background:#edf8ff;border-radius:13px;padding:12px 14px;color:#315b83;line-height:1.5;margin:12px 0}
.hint{margin-top:10px}.hint button{background:#e9efff;color:#3359a3;padding:8px 12px}.hint-text{display:none;background:#f0edff;padding:11px;border-radius:10px;margin-top:8px;color:#51428b}.hint-text.show{display:block}
.actions{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:24px}.primary{background:#216cdd;color:white;padding:13px 20px;font-size:16px}.secondary{background:#edf1f8;color:#34445f;padding:13px 18px}
.mini-map{width:min(100%,510px);display:block;margin:12px auto;border:2px solid #dce6f4;border-radius:14px;background:#f8fbff}
.key{display:inline-grid;place-items:center;border:2px solid #cbd5e1;border-bottom-width:4px;border-radius:7px;min-width:29px;padding:3px 7px;background:white;font-weight:900}
.character-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(125px,1fr));gap:10px;margin:14px 0}
.character{border:2px solid #e3eaf4;border-radius:14px;padding:12px;text-align:center;background:#fff}.character .emoji{font-size:36px}.character b{display:block}
.notice{font-size:13px;color:#66758c;line-height:1.5}
footer{text-align:center;color:#748198;padding:0 15px 24px;font-size:13px}
kbd{background:#fff;border:1px solid #cbd5e1;border-bottom:3px solid #cbd5e1;border-radius:5px;padding:2px 6px;font-weight:800}
@media(max-width:800px){main{grid-template-columns:1fr}aside{position:static}.nav-step{min-width:0}.panel{min-height:0}nav{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:480px){nav{grid-template-columns:1fr}.top-actions button{font-size:13px;padding:9px}}
</style>
</head>
<body>
<header>
 <div class="brand"><div class="logo">🧩</div><div><h1>¡La aventura del laberinto!</h1><p>Tu primera aventura programando con Scratch</p></div></div>
 <div class="top-actions"><button class="white" onclick="window.open('https://scratch.mit.edu/projects/editor/','_blank')">Abrir Scratch ↗</button><button class="white" onclick="window.print()">Imprimir guía</button></div>
</header>
<main>
<aside>
 <div class="progress-title"><span>Misiones</span><span id="count">0/7</span></div>
 <div class="track"><div class="fill" id="fill"></div></div>
 <nav id="nav"></nav>
 <p class="notice">💡 Consejo: deja esta guía abierta en una pestaña y Scratch en otra. Cambia entre ellas con <kbd>Alt</kbd> + <kbd>Tab</kbd>.</p>
</aside>
<section><div class="panel" id="content" aria-live="polite"></div></section>
</main>
<footer>Hecho para aprender paso a paso · No necesitas crear una cuenta de Scratch</footer>
<script>
const missions = [
{title:"¡Bienvenidos, creadores!",time:"5 min",tag:"EMPEZAMOS",intro:"Hoy vas a crear un videojuego: tendrás que llevar un personaje hasta la salida de un laberinto sin tocar las paredes. ¡Tú serás quien lo programe!",body:`
<div class="callout">🎯 <b>Tu misión final:</b> llegar a la meta usando las flechas del teclado. Si tocas una pared, volverás al principio.</div>
<div class="task"><h3>1. Abre Scratch</h3><p>Pulsa el botón azul «Abrir Scratch» de arriba. Se abrirá el editor en otra pestaña. No hace falta registrarse: puedes empezar como invitado.</p><p>Busca la zona de bloques a la izquierda, el espacio donde los encajamos en el centro y el escenario a la derecha.</p><label class="checkrow"><input type="checkbox"> He abierto Scratch y veo el gato en el escenario.</label></div>
<div class="task"><h3>2. ¡Conoce las piezas!</h3><p>En Scratch programamos uniendo bloques como si fueran piezas de construcción. Cada color nos ayuda a encontrar una familia de instrucciones.</p><p>🟡 Eventos · 🔵 Movimiento · 🟠 Control · 🟣 Apariencia · 🟢 Sensores</p></div>
<div class="tip">👩‍🏫 Si algo no sale a la primera, no pasa nada. Los programadores prueban, se equivocan y vuelven a intentarlo.</div>`},
{title:"Elige tu personaje",time:"5 min",tag:"MISIÓN 1",intro:"¡El héroe o la heroína de tu juego eres tú quien lo elige! Vamos a escoger un objeto (en Scratch se llama sprite).",body:`
<div class="task"><h3>1. Elige un personaje</h3><p>En Scratch, abajo a la derecha, pulsa el botón azul de elegir un objeto (la carita). Explora la biblioteca y elige el personaje que más te guste.</p>
<div class="character-grid"><div class="character"><div class="emoji">🐱</div><b>Un gato</b></div><div class="character"><div class="emoji">🐸</div><b>Una rana</b></div><div class="character"><div class="emoji">🦖</div><b>Un dinosaurio</b></div><div class="character"><div class="emoji">🐧</div><b>Un pingüino</b></div></div>
<p>Los dibujos son ideas: en Scratch puedes elegir cualquier personaje de su biblioteca.</p><label class="checkrow"><input type="checkbox"> Ya he elegido mi personaje.</label></div>
<div class="task"><h3>2. Quita el gato si has elegido otro</h3><p>Si no quieres usar el gato, selecciónalo en la lista de objetos y pulsa la papelera. ¡No borres el personaje nuevo!</p><label class="checkrow"><input type="checkbox"> En mi lista aparece el personaje que he elegido.</label></div>
<div class="tip">⭐ Consejo: haz clic en tu personaje en la lista de objetos para asegurarte de que está seleccionado antes de programarlo.</div>`},
{title:"Dibuja el laberinto",time:"10 min",tag:"MISIÓN 2",intro:"Ahora prepararemos el escenario. Vamos a dibujar caminos y paredes para que nuestro personaje tenga que encontrar la salida.",body:`
<div class="task"><h3>1. Abre el fondo para dibujarlo</h3><p>En la zona del escenario, selecciona «Fondos». Pulsa «Pintar» para crear un fondo nuevo. Elige la herramienta de línea y un color oscuro (por ejemplo, azul).</p><p>Haz las paredes bastante gruesas. Deja un camino libre desde la salida inicial hasta la meta.</p></div>
<svg class="mini-map" viewBox="0 0 480 270" role="img" aria-label="Ejemplo de laberinto sencillo con paredes azules, inicio verde y meta amarilla">
<rect x="3" y="3" width="474" height="264" rx="12" fill="#fff" stroke="#cbd5e1" stroke-width="6"/>
<path d="M8 8H472V262H8Z M95 8V75H185V155H95V262 M185 8V75H275V195H185 M275 8V75H385V145H275V262 M385 8V75" fill="none" stroke="#315b9a" stroke-width="13" stroke-linecap="square" stroke-linejoin="round"/>
<rect x="14" y="212" width="48" height="38" rx="8" fill="#45c779"/><text x="38" y="236" text-anchor="middle" font-size="13" font-weight="bold" fill="#103d27">INICIO</text>
<rect x="414" y="15" width="48" height="38" rx="8" fill="#ffd84d"/><text x="438" y="39" text-anchor="middle" font-size="13" font-weight="bold" fill="#654800">META</text>
<text x="240" y="254" text-anchor="middle" font-size="11" fill="#52627a">Ejemplo de camino: dibuja uno parecido, no tiene que ser igual.</text>
</svg>
<div class="callout">🖍️ Para que el juego detecte las paredes, píntalas todas del mismo color azul. Pinta la meta de un color distinto, por ejemplo amarillo o verde. Deja el inicio libre.</div>
<div class="task"><h3>2. ¡Comprueba tu fondo!</h3><p>Vuelve al escenario y mira si se ve el laberinto completo. Deja espacio suficiente para que tu personaje pueda moverse por los pasillos.</p><label class="checkrow"><input type="checkbox"> He dibujado paredes y he dejado un camino hasta la meta.</label></div>
<div class="hint"><button onclick="hint(this)">Necesito una pista</button><div class="hint-text">No dibujes pasillos demasiado estrechos. El personaje debe caber sin tocar las paredes. Si te equivocas, usa la goma o deshaz el último paso.</div></div>`},
{title:"¡A movernos!",time:"10 min",tag:"MISIÓN 3",intro:"Vamos a enseñar a nuestro personaje a caminar. Cada vez que pulses una flecha, se moverá un poquito.",body:`
<div class="task"><h3>1. Selecciona tu personaje</h3><p>Haz clic en su dibujo en la lista de objetos. Después abre la categoría <b>Eventos</b> (amarilla) y busca este bloque:</p>
<div class="block-stack"><div class="sblock e hat">al presionar <span class="pill">🟢 bandera verde</span></div></div>
<p>Arrástralo al centro. Este bloque inicia el programa cuando pulsas la bandera verde.</p></div>
<div class="task"><h3>2. Añade el movimiento hacia la derecha</h3><p>En <b>Control</b> (naranja), busca «por siempre» y encájalo debajo. Dentro pondremos una pregunta.</p>
<div class="block-stack"><div class="sblock e hat">al presionar 🟢 bandera verde</div><div class="sblock control">por siempre</div><div class="sblock control">　(aquí pondremos las instrucciones)</div></div>
<p>En <b>Control</b>, mete dentro un bloque «si... entonces». En <b>Sensores</b> (azul claro), busca «¿tecla espacio presionada?» y cambia espacio por flecha derecha. En <b>Movimiento</b>, añade «cambiar x por 10» dentro del si.</p>
<div class="block-stack"><div class="sblock e hat">al presionar 🟢 bandera verde</div><div class="sblock control">por siempre</div><div class="sblock control">si <span class="pill">¿tecla → presionada?</span> entonces</div><div class="sblock m">cambiar x por <span class="pill">10</span></div></div>
<p>La x mueve al personaje a izquierda y derecha. Un número positivo lo mueve a la derecha.</p></div>
<div class="task"><h3>3. ¡Prueba!</h3><p>Pulsa la bandera verde y después la flecha derecha. ¿Se mueve tu personaje?</p><label class="checkrow"><input type="checkbox"> Mi personaje se mueve hacia la derecha.</label></div>
<div class="hint"><button onclick="hint(this)">Necesito una pista</button><div class="hint-text">El bloque «si... entonces» está en Control. La pregunta «¿tecla ... presionada?» está en Sensores. Encaja la pregunta en el hueco con forma de hexágono del bloque si.</div></div>`},
{title:"Las cuatro flechas",time:"10 min",tag:"MISIÓN 4",intro:"¡Ya sabe caminar hacia la derecha! Ahora le enseñaremos a moverse en las cuatro direcciones.",body:`
<div class="task"><h3>1. Repite el mismo truco</h3><p>Dentro del mismo bloque «por siempre», crea tres bloques «si... entonces» más. Cambia la tecla y el movimiento en cada uno:</p>
<div class="block-stack">
<div class="sblock control">si <span class="pill">¿tecla ← presionada?</span> entonces</div><div class="sblock m">cambiar x por <span class="pill">-10</span></div><div class="arrow">↓</div>
<div class="sblock control">si <span class="pill">¿tecla ↑ presionada?</span> entonces</div><div class="sblock m">cambiar y por <span class="pill">10</span></div><div class="arrow">↓</div>
<div class="sblock control">si <span class="pill">¿tecla ↓ presionada?</span> entonces</div><div class="sblock m">cambiar y por <span class="pill">-10</span></div>
</div>
<p>Recuerda: <b>x</b> es izquierda/derecha y <b>y</b> es arriba/abajo. Los números negativos van en sentido contrario.</p></div>
<div class="task"><h3>2. ¡Prueba las cuatro direcciones!</h3><p>Pulsa la bandera verde. Usa las cuatro flechas. Si va demasiado rápido o demasiado lento, cambia 10 por 5 o por 15.</p><label class="checkrow"><input type="checkbox"> Mi personaje se mueve arriba, abajo, izquierda y derecha.</label></div>
<div class="tip">🧠 ¡Acabas de aprender un concepto importante! El programa está comprobando continuamente qué tecla estás pulsando gracias a «por siempre».</div>`},
{title:"¡No atravieses las paredes!",time:"10 min",tag:"MISIÓN 5",intro:"Un laberinto no sería un reto si pudiéramos atravesar las paredes. Vamos a detectar el color de las paredes y volver al inicio si las tocamos.",body:`
<div class="task"><h3>1. Coloca al personaje en el inicio</h3><p>Selecciona tu personaje. En Movimiento, añade debajo de «al presionar bandera verde» y antes de «por siempre» el bloque «ir a x: ... y: ...».</p><p>Usa las coordenadas para colocarlo en el inicio de tu laberinto. Puedes arrastrarlo al lugar correcto en el escenario y leer las coordenadas que aparecen en el bloque, o ajustar los números.</p><div class="block-stack"><div class="sblock e hat">al presionar 🟢 bandera verde</div><div class="sblock m">ir a x: <span class="pill">-210</span> y: <span class="pill">-140</span></div><div class="sblock control">por siempre</div></div></div>
<div class="task"><h3>2. Detecta las paredes</h3><p>Dentro de «por siempre», después de los cuatro movimientos, añade un bloque «si... entonces».</p><p>En Sensores busca «¿tocando el color ...?». Haz clic en el cuadrito de color y elige el mismo azul que usaste para las paredes.</p><p>Dentro del si, coloca «ir a x: ... y: ...» con las coordenadas del inicio.</p>
<div class="block-stack"><div class="sblock control">si <span class="pill">¿tocando el color azul?</span> entonces</div><div class="sblock m">ir a x: <span class="pill">inicio</span> y: <span class="pill">inicio</span></div></div>
<p>¡Importante! El color debe ser igual al de las paredes. Si no lo detecta, vuelve al fondo y comprueba el color.</p></div>
<div class="task"><h3>3. ¡Choca y comprueba!</h3><p>Pulsa la bandera verde y conduce tu personaje hasta una pared. ¡Debe regresar al inicio!</p><label class="checkrow"><input type="checkbox"> Cuando toca una pared, mi personaje vuelve al inicio.</label></div>
<div class="hint"><button onclick="hint(this)">Necesito una pista</button><div class="hint-text">El bloque «¿tocando el color?» está en Sensores. Para elegir el color exacto, haz clic en el cuadrito de color del bloque y usa el cuentagotas sobre una pared del escenario.</div></div>`},
{title:"¡La meta y la victoria!",time:"10 min",tag:"MISIÓN 6",intro:"¡Ya casi está! Ahora programaremos la meta para que el juego nos felicite cuando lleguemos al final.",body:`
<div class="task"><h3>1. Comprueba el color de la meta</h3><p>Tu meta debe tener un color diferente al de las paredes. Por ejemplo, amarillo. Si todavía no la has pintado, vuelve a Fondos y hazlo ahora.</p></div>
<div class="task"><h3>2. Programa la victoria</h3><p>Dentro de «por siempre», añade otro bloque «si... entonces» después del bloque que detecta las paredes.</p><p>En Sensores elige «¿tocando el color ...?» y selecciona el color de la meta. Dentro coloca en Apariencia (morado) el bloque «decir ¡LO CONSEGUISTE! durante 2 segundos».</p>
<div class="block-stack"><div class="sblock control">si <span class="pill">¿tocando el color de la meta?</span> entonces</div><div class="sblock s">decir <span class="pill">¡LO CONSEGUISTE!</span> durante <span class="pill">2</span> segundos</div><div class="sblock control">detener <span class="pill">todos</span></div></div>
<p>El bloque «detener todos» está en Control. Así el personaje deja de moverse al ganar.</p></div>
<div class="task"><h3>3. ¡Juega desde el principio!</h3><p>Pulsa la bandera verde, recorre el laberinto y llega a la meta sin tocar las paredes.</p><label class="checkrow"><input type="checkbox"> He llegado a la meta y aparece el mensaje de victoria.</label></div>
<div class="callout">🏆 ¡Enhorabuena! Has creado tu primer videojuego con Scratch. Has utilizado eventos, movimiento, bucles, condiciones y sensores.</div>`}
];
let current=0;let completed=new Set();
function renderNav(){const nav=document.getElementById('nav');nav.innerHTML='';missions.forEach((m,i)=>{const b=document.createElement('button');b.className='nav-step'+(i===current?' active':'')+(completed.has(i)?' done':'');b.innerHTML=`<span class="num">${completed.has(i)?'✓':i+1}</span><span class="nav-label">${m.title}</span><span class="nav-time">${m.time}</span>`;b.onclick=()=>{current=i;render()};nav.appendChild(b)});document.getElementById('count').textContent=`${completed.size}/7`;document.getElementById('fill').style.width=(completed.size/7*100)+'%'}
function render(){const m=missions[current];renderNav();document.getElementById('content').innerHTML=`<div class="eyebrow">${m.tag} · ${m.time}</div><h2>${m.title}</h2><p class="lead">${m.intro}</p>${m.body}<div class="actions"><button class="secondary" ${current===0?'disabled':''} onclick="go(-1)">← Anterior</button><button class="primary" onclick="finishAndNext()">${current===6?'¡Terminar!':'He terminado, siguiente →'}</button></div>${current===6?'<p class="notice">Al terminar, descarga tu proyecto: en Scratch ve a Archivo → Guardar en tu ordenador. El archivo tendrá extensión .sb3.</p>':''}`}
function go(d){current=Math.max(0,Math.min(6,current+d));render();window.scrollTo({top:0,behavior:'smooth'})}
function finishAndNext(){completed.add(current);if(current<6)current++;render();window.scrollTo({top:0,behavior:'smooth'})}
function hint(btn){btn.nextElementSibling.classList.toggle('show');btn.textContent=btn.nextElementSibling.classList.contains('show')?'Ocultar pista':'Necesito una pista'}
render();
</script>
</body>
</html>
